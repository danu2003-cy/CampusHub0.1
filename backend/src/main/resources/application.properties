# ===============================
# CampusHub Backend Configuration
# ===============================

server.port=8081

# ---- Database (MySQL) ----
spring.datasource.url=jdbc:mysql://localhost:3306/campushub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:../database/schema.sql
spring.sql.init.data-locations=file:../database/sample_data.sql

# ---- Jackson ----
spring.jackson.default-property-inclusion=non_null
